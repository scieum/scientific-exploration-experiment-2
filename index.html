<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>감염병 진단 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 실험대 위 아크릴 홈판을 중심에 둔 단일 열 작업 화면. 색은 반응 결과에만 강하게 쓴다. */
:root{
  --bg:#f4f5f8;--panel:#ffffff;--ink:#191c24;--muted:#5b6170;--line:#dde1e8;
  --accent:#3a5ce4;--accent-ink:#ffffff;--accent-soft:#eef2fe;--plate:#eef1f8;--well:#ffffff;--liq:#dce3f5;--enzyme:#d99a1c;
  --react:#c2185b;--react-pale:#f0a6c3;--on-react:#ffffff;--react-text:#c2185b;--good:#1c6b3f;--bad:#a8341c;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101218;--panel:#191c24;--ink:#e8eaf0;--muted:#a2a8b6;--line:#323744;
  --accent:#8ea4ff;--accent-ink:#0e1430;--accent-soft:#1f2747;--plate:#21252f;--well:#13161c;--liq:#343c55;--enzyme:#e6b34d;
  --react:#e8357d;--react-pale:#8f4a68;--on-react:#2a0614;--react-text:#f47aa9;--good:#71d29a;--bad:#f39a83;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101218;--panel:#191c24;--ink:#e8eaf0;--muted:#a2a8b6;--line:#323744;
  --accent:#8ea4ff;--accent-ink:#0e1430;--accent-soft:#1f2747;--plate:#21252f;--well:#13161c;--liq:#343c55;--enzyme:#e6b34d;
  --react:#e8357d;--react-pale:#8f4a68;--on-react:#2a0614;--react-text:#f47aa9;--good:#71d29a;--bad:#f39a83;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--sans);word-break:keep-all;overflow-wrap:break-word}
.top,main{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top{width:100%;padding-block:10px 6px;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center}
.brand{display:flex;gap:12px;align-items:center}
.bars{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.bars i{height:4px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--accent)}
.stepnow{justify-self:end;font-size:.88rem;color:var(--muted)}
.top b{font-size:1.15rem}
html,body{height:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
main{flex:1;min-height:0;width:100%;overflow:auto;padding-block:4px 12px;display:grid;gap:12px;align-content:start}
h1{font-size:clamp(1.15rem,2.4vw,1.5rem);line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.1rem;margin:0}
p{margin:0;max-width:65ch}
.steps{justify-self:end;list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--muted)}
.steps li[aria-current]{color:var(--ink);font-weight:700}
.steps li.past{color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,2vw,18px);display:grid;gap:10px;min-width:0;align-content:start}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cols{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cols>*{min-width:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.small{min-height:32px;padding:4px 10px;font-size:.82rem}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:grid;gap:4px;font-weight:500}
input,textarea,select{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea{min-height:72px;resize:vertical;font-weight:400}
.msg{color:var(--bad);font-weight:500;background:var(--panel);border:1.5px solid var(--bad);border-radius:10px;padding:8px 12px;max-width:none}
.msg::before{content:"⚠ "}
.note{color:var(--muted);font-size:.9rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle}
td.l,th.l{text-align:left}
th{background:var(--plate);font-weight:500}
td,.num{font-variant-numeric:tabular-nums}
/* 시약 순서 띠 */
.flow{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:.85rem}
.flow span{padding:3px 9px;border:1px solid var(--line);border-radius:6px}
.flow i{font-style:normal;color:var(--muted);font-size:.8rem}
.clock{font-family:var(--mono);font-size:1.15rem}
/* 홈판 */
.plate{padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:var(--pw);width:100%;margin-inline:auto}
.bench{--pw:min(520px,58dvh);background:var(--plate);border-radius:20px;padding:clamp(10px,2vw,22px);display:flex;flex-direction:column;justify-content:center;gap:8px}
.bench.view,.bench.inspect{--pw:min(380px,34dvh)}
.bench.drop .plate{padding-top:clamp(40px,8dvh,84px)}
.well{position:relative;aspect-ratio:1;max-width:100%;padding:0;min-height:0;border-radius:50%;background:var(--well);border:2px solid var(--line);overflow:hidden;display:block;width:100%}
.well .liq{position:absolute;inset:calc(50% - var(--r)/2);border-radius:50%;background:var(--liq);transition:inset .25s}
.well.lv1 .liq{background:var(--react-pale);animation:bloom 1.4s ease-out}
.well.lv2 .liq{background:var(--react);animation:bloom 1.4s ease-out}
.well .wn{position:absolute;inset:0;display:grid;place-items:center;font:500 1rem var(--mono)}
.well.lv2 .wn{color:var(--on-react)}
.well.sel{outline:3px solid var(--accent);outline-offset:2px}
.well.dripped::after{content:"";position:absolute;left:calc(50% - 5px);top:-14px;width:10px;height:14px;border-radius:50% 50% 50% 50%/30% 30% 70% 70%;background:var(--c,var(--accent));animation:drip .35s ease-in forwards}
@keyframes drip{to{transform:translateY(46px);opacity:0}}
@keyframes bloom{from{background:var(--liq)}}
.plabels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:var(--pw);width:100%;margin-inline:auto;font-size:.8rem;text-align:center;color:var(--muted);}
.rack{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.chip{min-height:38px;padding:5px 10px;font-size:.9rem}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
svg{display:block;width:100%;height:auto;max-width:100%}
svg text{fill:var(--muted);font:12px var(--sans)}
.ax{stroke:var(--line);fill:none}
.ln{stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lim{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.mol-cap{stroke:var(--accent);stroke-width:5;fill:none;stroke-linecap:round}
.mol-det{stroke:var(--muted);stroke-width:5;fill:none;stroke-linecap:round}
.mol-ag{fill:var(--good)}
.mol-enz{fill:var(--enzyme)}
.mol-pro{fill:var(--react)}
.surface{fill:var(--plate)}
.card-done{display:block;padding:4px 10px;border:1px solid var(--line);border-radius:6px;font-size:.9rem}
main>.panel{max-width:920px;width:100%;margin-inline:auto}
.split{display:grid;gap:20px;align-items:start}
.side{display:grid;gap:16px;min-width:0}
@media (min-width:960px){.split{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}}
@media (max-width:719px){.steps{display:none}}
@media (min-width:720px){.stepnow{display:none}}
@media (max-width:959px){.actbar .go{flex:1}}
@media (min-width:720px){.narrow-only,.tabs.narrow-only{display:none}}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 14px;max-width:none}
.head{display:flex;gap:14px;align-items:center}
.timer{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*360deg),var(--line) 0);font-weight:700}
.timer span{width:46px;height:46px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:.95rem}
.flow b{font-weight:500;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.flow b.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.flow b.done::after{content:" ✓"}
.wcell{position:relative}
.well{box-shadow:inset 0 3px 6px rgb(20 24 40/.14)}
.well[aria-pressed="true"]{background:var(--well);color:var(--ink)}
.well.can{border:2px dashed var(--accent)}
.well.nope{border-color:var(--bad);animation:shake .35s}
.well.nope::before{content:"✕";position:absolute;inset:0;z-index:2;display:grid;place-items:center;font:700 2.2em var(--sans);color:var(--bad);background:color-mix(in srgb,var(--panel) 65%,transparent)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.well.target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent),inset 0 3px 6px rgb(20 24 40/.14)}
.dropper{position:absolute;left:50%;bottom:calc(100% - 8px);width:clamp(18px,32%,40px);transform:translateX(-50%);pointer-events:none}
.pdots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:var(--pw);width:100%;margin-inline:auto}
.pdots>span{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;font-size:.7rem;color:var(--muted)}
.pdots i{display:inline-flex;gap:2px;align-items:center;font-style:normal}
.pdots u{width:clamp(6px,1.6vw,8px);height:clamp(6px,1.6vw,8px);border-radius:50%;border:1.2px solid var(--line)}
.pdots u.on{background:var(--c);border-color:var(--c)}
.nowrap{white-space:nowrap}
.legend{margin-top:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:.82rem;color:var(--muted);max-width:none}
.pill{justify-self:start;background:var(--accent-soft);border-radius:999px;padding:6px 14px;font-size:.9rem;max-width:none}
.pill small{color:var(--muted);margin-right:6px;font-size:.82rem}
.shelf{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr))}
.dropbtn{width:100%;min-height:52px;font-size:1.05rem}
.shelfhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.bottle{display:grid;justify-items:center;align-content:start;height:100%;gap:6px;padding:10px 4px;font-size:.82rem;line-height:1.3;transition:transform .15s}
.bottle svg{width:34px}
.bottle[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.vs .res{display:block;font-size:1.4rem}
.vs>b{color:var(--muted)}
#chartd svg{max-width:min(560px,70dvh);max-height:38dvh;margin-inline:auto}
.today{stroke:var(--accent);stroke-width:1.5;opacity:.35}
.obs input{width:3.2em;height:34px;padding:2px 4px;display:inline-block;margin-inline:6px;text-align:center}
.persons{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.person{display:grid;gap:8px;align-content:start}
@media (max-width:719px){.persons[data-show="p1"] .person-p2,.persons[data-show="p2"] .person-p1{display:none}}
.tabs{display:flex;gap:6px}.tabs button{flex:1;min-height:38px}
.charts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.cmp summary{cursor:pointer;font-weight:500;padding:4px 0}
.sheetclose{display:none}
@media (min-width:960px){.mid-only,.tabs.mid-only{display:none}}
@media (max-width:959px){.cmpview[data-show="g"] .cmp-o,.cmpview[data-show="o"] .cmp-g{display:none}}
@media (max-width:959px){.sheet{position:fixed;left:8px;right:8px;bottom:8px;max-height:72dvh;overflow:auto;z-index:5;box-shadow:0 8px 32px rgb(0 0 0/.25)}.sheetclose{display:inline-flex;justify-self:end}.side-ph{display:none}}
.qnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qbox textarea{min-height:min(240px,32dvh)}
.howto{margin:0;padding:0;list-style:none;counter-reset:h;display:grid;gap:10px}
.howto li{counter-increment:h;display:grid;grid-template-columns:32px 1fr;column-gap:12px;align-items:start}
.howto li::before{content:counter(h);grid-row:span 2;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.howto span{color:var(--muted);font-size:.92rem}
.intro .note{font-size:.85rem}
@media (max-width:719px){.side>.intro{display:none}.howto{gap:6px}}
@media (max-width:959px){.howto.small span{display:none}}
.howto.small li{grid-template-columns:28px 1fr}.howto.small li::before{width:28px;height:28px;font-size:.85rem}
.sw{display:grid;justify-items:center;gap:4px;padding:6px 6px 4px;min-height:0;border:2px solid transparent;background:none;border-radius:10px;font-size:.78rem;line-height:1.2}
.sw:hover{border-color:var(--line)}
.sw i{width:34px;height:34px;border-radius:50%;background:var(--sw);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:700}
.sw[aria-pressed="true"]{background:var(--panel);color:var(--ink);border-color:var(--accent);font-weight:700}
.sw[aria-pressed="true"] i::after{content:"✓";color:var(--accent)}
.sw[aria-pressed="true"] i.k2::after{color:var(--on-react)}
table.rec td .row{gap:4px;flex-wrap:nowrap}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.slots li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;min-height:44px;padding:6px 12px;border-radius:12px;border:1.5px dashed var(--line);font-size:.92rem}
.slots b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--plate);color:var(--muted);font-size:.85rem}
.slots li.filled{border:1px solid transparent;background:var(--accent-soft)}
.slots li.filled b{background:var(--accent);color:var(--accent-ink)}
.slots li.filled i{font-style:normal;color:var(--accent);font-weight:700}
.slots li.next{border-color:var(--accent);color:var(--accent)}
.slots li.next b{background:var(--accent-soft);color:var(--accent)}
.slotbox summary{cursor:pointer;font-weight:700;padding:4px 0 8px}
.deckhead{margin-top:6px}
.desk-deck,.mob-deck{display:grid;gap:8px}
@media (min-width:960px){.mob-deck{display:none}.desk-deck .deck{grid-template-columns:1fr}}
@media (max-width:959px){.desk-deck{display:none}}
.deck{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pcard{position:relative;display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:12px;box-shadow:0 1px 0 var(--line);min-height:56px}
.pcard::before{content:"";flex:none;width:6px;align-self:stretch;border-radius:3px;background:var(--accent-soft)}
.pcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.pcard.nope{border-color:var(--bad);animation:shake .35s}
.pcard.nope::after{content:"✕";position:absolute;right:10px;top:6px;color:var(--bad);font-weight:700}
@media (max-width:719px){.slots li.empty{display:none}.slots li{min-height:38px;padding:4px 10px;font-size:.85rem}.deck{grid-template-columns:1fr}.pcard{min-height:44px;padding:8px 12px;font-size:.88rem}}
.teacher{display:none}
.res{font-weight:700}
.res.pos{color:var(--react-text)}
.res.neg{color:var(--good)}
@media (min-width:960px){.narrow-word{display:none}}
/* 휴대폰·태블릿 세로: 다음 단계 버튼은 화면 아래 고정 막대에 둔다 */
@media (max-width:959px){
  main:has(.actbar){padding-bottom:84px}
  .actbar{position:fixed;left:0;right:0;bottom:0;z-index:3;flex-wrap:nowrap;background:var(--panel);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
  .actbar>button{flex:1;min-height:50px;font-weight:700}
  .actbar>.go-m{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
}
@media (max-width:959px){.desk-only{display:none}
  .shelf{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .bottle{padding:6px 2px;font-size:.66rem;min-height:0}.bottle svg{width:22px}
  .dropbtn{min-height:44px;font-size:.95rem}.bench.drop .plate{padding-top:clamp(32px,6dvh,60px)}}
@media (max-width:719px){.rc{display:none}}
@media (min-width:720px){.rcm{display:none}}
@media (max-width:719px){.plabels b,.plabels br{display:none}
  main{gap:8px}.panel{gap:8px;padding:10px}.split,.side{gap:8px}
  .bench.drop .plate{padding-top:30px}.bench{padding:8px}
  .bottle{padding:4px 2px}.dropbtn{min-height:42px}}
/* PC·태블릿 가로: 화면 전체를 채운다 */
@media (min-width:960px){
  .top,main{max-width:none;padding-inline:28px}
  main{display:flex;flex-direction:column;gap:16px;padding-block:16px 20px}
  main>.split,main>.panel:not(.doc),main>.thinkgrid{flex:1;min-height:0}
  main>.panel:not(.doc){max-width:none!important;display:flex;flex-direction:column}
  main>.panel.doc{max-width:920px}
  .split{grid-template-columns:minmax(0,1fr) 400px;align-items:stretch}
  .split>.panel{display:flex;flex-direction:column;gap:14px;padding:28px;border-radius:20px;overflow:auto}
  .side{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;overflow:auto}
  .side>.panel{border:0;padding:0;border-radius:0;background:none}
  .side>.actbar{margin-top:auto}
  .side>.actbar>button,.split>.panel>.actbar>button{flex:1}
  .hero{justify-content:center;padding:48px!important;gap:18px!important}
  .hero h1{font-size:clamp(1.8rem,3vw,2.6rem)}
  .split>.panel>.actbar{margin-top:auto}
  .side>.note+.actbar,.side>.note:has(+.actbar){margin-top:auto}
  .side>.note:has(+.actbar)+.actbar{margin-top:0}
  .split>.panel>.bench{flex:1}
  .bench.drop{--pw:min(860px,calc((100dvh - 400px)*1.7))}
  .bench.inspect{--pw:min(560px,max(220px,calc((100dvh - 600px)*1.8)))}
  .persons{flex:1}
  .person{display:flex;flex-direction:column}
  .person>label{flex:1;grid-template-rows:auto 1fr}
  .person textarea{height:100%}
  main>.panel>.actbar{justify-content:flex-end}
  .thinkgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}
  .qlist{display:flex;flex-direction:column;gap:8px}
  .qbox{display:flex;flex-direction:column;padding:28px;border-radius:20px}
  .qbox>label{flex:1;grid-template-rows:auto 1fr}
  .qbox textarea{height:100%;min-height:200px}
  .qnav{justify-content:flex-end}
  #chartd{flex:1;min-height:0;display:flex;justify-content:center}
  #chartd svg{height:100%;width:auto;max-width:100%;max-height:none}
  .cmp-g{gap:12px}
}
/* 휴대폰: 한 화면에 들어오도록 줄인다 */
@media (max-width:719px){
  .legend,.wide-only,.shelf-title{display:none}

<script id="logic">
// 선생님이 바꿀 수 있는 내용: 생각해 보기 질문 3개
const QUESTIONS=[
  '홈 1(음성 표준 시료)과 홈 2(양성 표준 시료)를 사람의 시료와 함께 실험해야 하는 까닭을 쓰시오. 대조군이 예상과 다른 색을 보이면 사람의 결과를 어떻게 다루어야 하는지도 쓰시오.',
  '항원과 항체의 결합을 이용하여, 시료에 병원체가 있을 때만 색이 변하는 까닭을 포획 항체, 항원, 검출 시약, 진단 반응물의 순서로 설명하시오.',
  '단백질을 이용한 진단 기술과 핵산을 이용한 진단 기술의 장단점을 비교하고, 감염 초기가 의심되는 환자에게 알맞은 기술을 근거와 함께 고르시오. 또 이 기술들이 사회 문제 해결에 어떻게 유용한지 쓰시오.',
];
const SAMPLES=['neg','pos','p1','p2']; // 홈 1~4에 넣어야 하는 시료
const NAMES={cap:'포획 항체',neg:'감염병 음성 표준 시료',pos:'감염병 양성 표준 시료',p1:'사람 1의 시료',p2:'사람 2의 시료',det:'검출 시약',sub:'진단 반응물'};
const COLORS=['무색','연한 붉은색','붉은색'];

function hash(s){let h=2166136261;for(const c of String(s)){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
// 같은 학번은 늘 같은 환자 결과를 받는다
// 교과서 예시처럼 사람 1만 감염. 핵산 진단의 사람 3만 학번마다 달라진다
function caseFor(id){const h=hash(String(id).trim());return{p1:true,p2:false,p3:!!(h&4)}}
function truthOf(c){return{neg:false,pos:true,p1:c.p1,p2:c.p2}}

// adds: [{r:시약, t:몇 번째 5분 구간}]. 앞 단계 물질이 이미 붙은 뒤에 넣어야 결합한다.
function evalWell(adds,truth){
  const first=(rs,after)=>{const ts=adds.filter(a=>rs.includes(a.r)&&a.t>after).map(a=>a.t);return ts.length?Math.min(...ts):null};
  const n=rs=>adds.filter(a=>rs.includes(a.r)).length;
  const ag=SAMPLES.filter(s=>truth[s]);
  const tCap=first(['cap'],-1);
  const tAg=tCap===null?null:first(ag,tCap);
  const tDet=tAg===null?null:first(['det'],tAg);
  const tSub=tDet===null?null:first(['sub'],tDet);
  const bound={cap:tCap!==null,ag:tAg!==null,det:tDet!==null,sub:tSub!==null};
  if(!bound.sub)return{level:0,bound};
  return{level:Math.min(n(['cap']),n(ag),n(['det']),n(['sub']))<2?1:2,bound};
}
// 한 번의 실험에서 나온 절차 오류의 종류
function auditRun(wells){
  const e=new Set();
  wells.forEach((adds,i)=>{
    const want=SAMPLES[i],need=['cap',want,'det','sub'];
    const n=r=>adds.filter(a=>a.r===r).length;
    const t=r=>{const ts=adds.filter(a=>a.r===r).map(a=>a.t);return ts.length?Math.min(...ts):null};
    for(const r of need){
      const label=r===want?'진단 시료':NAMES[r];
      if(!n(r))e.add(label+'를 빠뜨림');else if(n(r)!==2)e.add(label+' 방울 수가 2방울이 아님');
    }
    if(SAMPLES.some(s=>s!==want&&n(s)))e.add('다른 홈의 시료를 넣음');
    const ts=need.map(t).filter(x=>x!==null);
    if(ts.some((x,k)=>k&&ts[k-1]>=x))e.add('시약 순서나 5분 대기를 지키지 않음');
  });
  return[...e];
}
const STEP_OF={cap:0,neg:1,pos:1,p1:1,p2:1,det:2,sub:3};
const STEP_OBJ=['포획 항체를','진단 시료를','검출 시약을','진단 반응물을'];
// 지금 넣으면 안 되는 곳이면 그 까닭을, 넣어도 되면 ''를 돌려준다
function checkDrop(wells,step,r,i){
  if(step>3)return '네 가지 시약을 모두 넣었어요. 실험을 마치고 색을 관찰하세요.';
  const s=STEP_OF[r];
  if(s>step)return `아직 ${STEP_OBJ[s]} 넣을 차례가 아니에요. 지금은 ${STEP_OBJ[step]} 넣어요.`;
  if(s<step)return `${STEP_OBJ[s].slice(0,-1)} 넣는 단계는 끝났어요. 지금은 ${STEP_OBJ[step]} 넣어요.`;
  if(s===1&&r!==SAMPLES[i])return `홈 ${i+1}에는 ${NAMES[SAMPLES[i]]}를 넣어야 해요.`;
  if(wells[i].filter(a=>a.r===r).length>=2)return `홈 ${i+1}에는 이미 2방울을 넣었어요.`;
  return '';
}
// 지금 단계의 시약이 모든 홈에 2방울씩 들어갔는가
function stepDone(wells,step){return step<=3&&wells.every((w,i)=>w.filter(a=>a.r===(step===1?SAMPLES[i]:['cap','','det','sub'][step])).length>=2)}
// 채점 기준 표의 칸을 그대로 옮긴 참고 점수. 최종 점수는 교사가 정한다.
function scoreProcess(errors){return errors?(errors>=3?10:20):30}
function scoreRecord(rec,actual){return rec.filter((r,i)=>r===actual[i]).length*5}
function scoreConclusion(judge,basis,levels){
  const people=[['p1',levels[2]],['p2',levels[3]]];
  if(!people.every(([p,l])=>judge[p]===(l>0?'감염':'비감염')))return 10;
  return people.every(([p,l])=>basis[p]===(l>0?'pos':'neg'))?20:15;
}
</script>

<script>
const KEY='dx-sim-v4'; // v4: 소개 화면 추가로 단계 번호가 바뀜
const STAGES=['소개','단백질 진단','결과 기록','감염 판정','핵산 진단','기술 비교','생각해 보기','결과지'];
const PCR_STEPS=[
  '검사 대상자(사람 3과 4)로부터 시료를 채취한다.',
  '시료에서 핵산을 추출한다.',
  '추출한 핵산을 중합효소연쇄반응 재료와 함께 장치에 넣는다.',
  '병원체의 핵산만 여러 차례 증폭(복제)시켜 본다.',
  '병원체의 핵산의 양이 늘어나는지 확인한다.',
];
const PCR_SHOW=[3,1,4,0,2];
const DAY_AMOUNT=[.5,2,3.5,5,6.5,7,6.5,5.5],LIM_PROTEIN=4.5,LIM_NA=1.5; // 수업용 모형값

const fresh=restarts=>({stage:0,id:'',name:'',run:1,wells:[[],[],[],[]],block:0,clock:0,spoite:null,
  drip:null,done:false,levels:[],bounds:[],runErrors:[],record:[null,null,null,null],inspect:null,
  jp:'p1',ct:'g',q:0,pcrNope:null,lastWell:null,slips:[],nope:null,waitUntil:0,obs:{from:'',to:'',why:''},judge:{},basis:{},why:{p1:'',p2:''},pcrDone:[],pcrWrong:0,pcrPick:null,cycles:0,pcrJudge:{},day:1,answers:['','',''],
  msg:'',confirm:false,restarts,finished:''});
let S=fresh(0);
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved)S=Object.assign(fresh(0),saved)}catch{}
const WAIT_MS=10000; // 실제 5분을 수업용으로 10초로 줄임
const waitFrac=()=>S.waitUntil?Math.min(1,1-(S.waitUntil-Date.now())/WAIT_MS):0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
const go=n=>{S.stage=n;S.msg='';render();scrollTo(0,0)};
const truth=()=>truthOf(caseFor(S.id));
const btn=(act,arg,label,cls='',extra='')=>`<button class="${cls}" data-act="${act}" data-arg="${esc(arg)}" ${extra}>${label}</button>`;
const toggle=(act,arg,label,on,cls='',extra='')=>btn(act,arg,label,cls,`aria-pressed="${!!on}" ${extra}`);
const msg=()=>S.msg?`<p class="msg" role="alert">${esc(S.msg)}</p>`:'';

const RC={cap:'var(--accent)',neg:'var(--good)',pos:'var(--good)',p1:'var(--good)',p2:'var(--good)',det:'var(--muted)',sub:'var(--enzyme)'};
const SHORT={cap:'포획 항체',neg:'음성 표준',pos:'양성 표준',p1:'사람 1',p2:'사람 2',det:'검출 시약',sub:'진단 반응물'};
const GROUPS=[[['cap'],'포획 항체','var(--accent)'],[SAMPLES,'진단 시료','var(--good)'],[['det'],'검출 시약','var(--muted)'],[['sub'],'진단 반응물','var(--enzyme)']];
const dropperSvg=c=>`<svg class="dropper" viewBox="0 0 40 100" aria-hidden="true"><ellipse cx="20" cy="14" rx="12" ry="14" fill="var(--accent)"/><rect x="13" y="22" width="14" height="42" rx="4" fill="var(--well)" stroke="var(--ink)" stroke-width="1.5"/><rect x="16" y="40" width="8" height="20" rx="2" fill="${c}"/><rect x="17" y="63" width="6" height="16" rx="2" fill="var(--well)" stroke="var(--ink)" stroke-width="1.5"/></svg>`;
const bottleSvg=c=>`<svg viewBox="0 0 36 58" aria-hidden="true"><rect x="8" width="20" height="10" rx="3" fill="${c}"/><rect x="12" y="10" width="12" height="6" fill="var(--line)"/><rect x="1" y="16" width="34" height="41" rx="8" fill="var(--well)" stroke="var(--line)" stroke-width="1.5"/><rect x="4" y="34" width="28" height="20" rx="6" fill="${c}" opacity=".55"/></svg>`;
function plate(mode){
  const r=i=>S.done?'78%':Math.min(30+S.wells[i].length*7,78)+'%';
  const drop=mode==='drop',holding=drop&&S.spoite;
  const wells=S.wells.map((w,i)=>{
    const cls=['well',S.done?'lv'+S.levels[i]:'',S.drip===i?'dripped':'',mode==='inspect'&&S.inspect===i?'sel':'',drop&&S.lastWell===i?'target':'',holding&&S.lastWell!==i&&!checkDrop(S.wells,S.block,S.spoite,i)?'can':'',S.nope===i?'nope':''].join(' ');
    const label=`홈 ${i+1}, ${S.done?COLORS[S.levels[i]]:w.length+'방울'}`;
    return `<div class="wcell"><button class="${cls}" style="--c:${RC[S.spoite]||'var(--accent)'}" data-act="${mode==='inspect'?'inspect':'pick'}" data-arg="${i}" aria-label="${label}${drop&&S.lastWell===i?', 고른 홈':''}" ${drop?`aria-pressed="${S.lastWell===i}"`:''} ${mode==='view'?'disabled':''}><span class="liq" style="--r:${r(i)}"></span><span class="wn">${i+1}</span></button>${holding&&S.lastWell===i?dropperSvg(RC[S.spoite]):''}</div>`;
  }).join('');
  const dots=drop?`<div class="pdots">${S.wells.map((w,i)=>`<span role="img" aria-label="홈 ${i+1}: ${GROUPS.map(([rs,n])=>n+' '+w.filter(a=>rs.includes(a.r)).length+'방울').join(', ')}">${GROUPS.map(([rs,,c])=>{const n=w.filter(a=>rs.includes(a.r)).length;return `<i style="--c:${c}"><u class="${n>0?'on':''}"></u><u class="${n>1?'on':''}"></u>${n>2?'+'+(n-2):''}</i>`}).join('')}</span>`).join('')}</div>
  <p class="legend">${GROUPS.map(([,n,c])=>`<span><span class="swatch" style="background:${c}"></span>${n}</span>`).join('')}</p>`:'';
  return `<div class="bench ${mode}"><div class="plate" role="group" aria-label="홈판">${wells}</div>
  <div class="plabels">${SAMPLES.map((s,i)=>`<span><b>홈 ${i+1}</b><br>${SHORT[s]}</span>`).join('')}</div>${dots}</div>`;
}
const todo=()=>S.waitUntil?`⏳ 반응을 기다리는 중이에요. ${Math.ceil((S.waitUntil-Date.now())/1000)}초 남았어요. (실제로는 5분)`:S.block>3?'④까지 모두 넣었어요. <b>실험을 마치고 색 관찰하기</b>를 누르세요.'
  :stepDone(S.wells,S.block)?`모든 홈에 ${STEP_OBJ[S.block]} 넣었어요. <b>5분 기다리기</b>를 누르세요.`
  :S.block===1?'홈 아래 이름과 같은 <b>시료</b>를 2방울씩 넣어요.<span class="desk-only"> <span class="nowrap">홈 1 ← 음성 표준</span> · <span class="nowrap">홈 2 ← 양성 표준</span> · <span class="nowrap">홈 3 ← 사람 1</span> · <span class="nowrap">홈 4 ← 사람 2</span></span>'
  :`모든 홈에 <b>${STEP_OBJ[S.block]}</b> 2방울씩 넣어요.<span class="desk-only"> 시약병 집기 → 홈 고르기 → <b>한 방울 떨어뜨리기</b></span>`;
const flow=step=>`<div class="flow">${['포획 항체','진단 시료','검출 시약','진단 반응물'].map((t,k)=>`<b class="${k<step?'done':k===step?'now':''}">${'①②③④'[k]} ${t}</b>`).join('<i>5분 뒤</i>')}</div>`;

function molecule(i){
  const b=S.bounds[i];
  const lv=S.levels[i];
  const y=(x,cls,flip)=>flip
    ?`<path class="${cls}" d="M${x} 44V62M${x} 62L${x-11} 78M${x} 62L${x+11} 78"/>`
    :`<path class="${cls}" d="M${x} 150V128M${x} 128L${x-11} 112M${x} 128L${x+11} 112"/>`;
  const site=x=>(b.cap?y(x,'mol-cap'):'')
    +(b.ag?`<circle class="mol-ag" cx="${x}" cy="97" r="13"/>`:'')
    +(b.det?y(x,'mol-det',true)+`<rect class="mol-enz" x="${x-9}" y="26" width="18" height="18" rx="3"/>`:'')
    +(b.sub?[-24,-16,18,26].map((d,k)=>`<circle class="mol-pro" cx="${x+d}" cy="${18+k*9}" r="4"/>`).join(''):'');
  const say=!b.cap?'포획 항체가 바닥에 없어서 항원을 붙잡을 곳이 없어요.'
    :!b.ag?'붙잡힌 항원이 없어요. 검출 시약도 결합하지 못하고 씻겨 나가 색이 변하지 않아요.'
    :!b.det?'항원은 붙잡혔지만 검출 시약이 결합하지 못해 효소가 없어요.'
    :!b.sub?'효소는 붙어 있지만 진단 반응물이 효소와 만나지 못해 색이 변하지 않아요.'
    :lv===2?'포획 항체–항원–검출 시약이 차례로 결합했고, 효소가 진단 반응물을 붉은색 물질로 바꾸었어요.'
    :'결합은 일어났지만 넣은 양이 적어서 색이 연해요.';
  return `<div class="panel sheet" role="region" aria-label="홈 ${i+1} 분자 수준"><div class="row" style="justify-content:space-between"><h2>홈 ${i+1} 분자 수준으로 보기</h2>${btn('inspect','','닫기','small sheetclose')}</div>
    <svg viewBox="0 0 320 160" role="img" aria-label="${esc(say)}"><rect class="surface" y="150" width="320" height="10"/>${site(90)}${site(230)}</svg>
    <p class="note"><span class="swatch" style="background:var(--accent)"></span>포획 항체 <span class="swatch" style="background:var(--good)"></span>항원 <span class="swatch" style="background:var(--muted)"></span>검출 시약 항체 <span class="swatch" style="background:var(--enzyme)"></span>결합 효소 <span class="swatch" style="background:var(--react)"></span>색을 띠는 물질</p>
    <p>${esc(say)}</p>
    <p class="note">결합하지 않은 물질은 각 단계 사이에 씻겨 나간다고 가정했어요. 실제 효소결합면역흡착검사(ELISA)의 세척 과정이에요.</p></div>`;
}

function pcrChart(pos,n,name){
  const X=c=>44+c*(232/30),Y=v=>140-v*120;
  const pts=[...Array(n+1).keys()].map(c=>`${X(c).toFixed(1)},${Y(pos?2**(c-30):.01).toFixed(1)}`).join(' ');
  const ticks=[0,10,20,30].map(c=>`<text x="${X(c)}" y="156" text-anchor="middle">${c}</text>`).join('');
  return `<svg viewBox="0 0 290 176" role="img" aria-label="${name}의 증폭 횟수에 따른 핵산의 양, 현재 ${n}회"><text x="44" y="12">${name}: 핵산의 양</text><path class="ax" d="M44 20V140H276"/>${ticks}<text x="276" y="172" text-anchor="end">증폭 횟수</text>${n?`<polyline class="ln" points="${pts}"/>`:''}</svg>`;
}
function dayChart(day){
  const X=d=>44+d*(230/7),Y=v=>140-v*15;
  const pts=DAY_AMOUNT.map((v,d)=>`${X(d)},${Y(v)}`).join(' ');
  const ticks=DAY_AMOUNT.map((_,d)=>`<text x="${X(d)}" y="156" text-anchor="middle">${d}</text>`).join('');
  return `<svg viewBox="0 0 290 176" role="img" aria-label="감염 후 일수에 따른 병원체의 양과 두 검사의 검출 한계"><text x="44" y="12">병원체의 양 (수업용 모형값)</text><path class="ax" d="M44 20V140H276"/>

}
function pcrSlots(){
  const done=S.pcrDone,next=done.length;
  return `<ol class="slots">${PCR_STEPS.map((_,k)=>k<next?`<li class="filled"><b>${k+1}</b><span>${PCR_STEPS[done[k]]}</span><i aria-label="맞음">✓</i></li>`
    :k===next?`<li class="next"><b>${k+1}</b><span>${k?'다음':'첫'} 단계 카드를 고르세요</span></li>`:`<li class="empty"><b>${k+1}</b><span></span></li>`).join('')}</ol>`;
}
function pcrJudge(){
  if(S.cycles<30)return '<span class="note">30회까지 증폭한 뒤 판정할 수 있어요.</span>';
  return [['p3','사람 3'],['p4','사람 4']].map(([p,n])=>`<b>${n}</b>${['감염','비감염'].map(v=>toggle('pcrJ',`${p}:${v}`,v,S.pcrJudge[p]===v,'chip')).join('')}`).join(' ');
}
function dayResult(){

}

    if(!S.spoite){S.msg='먼저 시약 선반에서 시약병을 눌러 스포이트를 집으세요.';return render()}
    if(i===null){S.msg='시약을 넣을 홈을 먼저 누르세요.';return render()}
    const why=checkDrop(S.wells,S.block,S.spoite,i);
    if(why){S.msg=why;S.slips.push(why);S.nope=i;return render()}
    S.wells[i].push({r:S.spoite,t:S.block});S.drip=S.lastWell=i;S.msg='';render();S.drip=null;
  },
  wait(){
    if(S.block>3){S.msg='네 가지 시약을 모두 넣었어요. 실험을 마치고 색을 관찰하세요.';return render()}
    if(!stepDone(S.wells,S.block)){S.msg=`아직 모든 홈에 ${STEP_OBJ[S.block]} 2방울씩 넣지 않았어요.`;S.slips.push(S.msg);return render()}
    S.waitUntil=Date.now()+WAIT_MS;S.msg='';render();tick();
  },
  finish(){
    if(S.block<4){S.msg=stepDone(S.wells,3)?'진단 반응물이 반응하도록 5분 기다리기를 누른 뒤 마치세요.':'아직 네 가지 시약을 모두 넣지 않았어요.';return render()}
    const t=truth(),res=S.wells.map(w=>evalWell(w,t));
    S.levels=res.map(r=>r.level);S.bounds=res.map(r=>r.bound);
    S.runErrors.push(auditRun(S.wells));S.done=true;go(2);
  },
  inspect(i){S.inspect=i===''?null:+i;render()},
  rec(a){const[i,k]=parts(a);S.record[+i]=+k;render()},
  retry(){Object.assign(S,{run:S.run+1,wells:[[],[],[],[]],block:0,clock:0,spoite:null,done:false,record:[null,null,null,null],inspect:null,lastWell:null,waitUntil:0});go(1)},
  toJudge(){
    if(S.record.includes(null)){S.msg='네 홈의 색을 모두 기록하세요.';return render()}
    go(3);
  },
  jp(p){S.jp=p;render()},
  ct(k){S.ct=k;render()},
  judge(a){const[p,v]=parts(a);S.judge[p]=v;render()},
  basis(a){const[p,v]=parts(a);S.basis[p]=v;render()},
  toPcr(){
    if(!S.judge.p1||!S.judge.p2||!S.basis.p1||!S.basis.p2){S.msg='두 사람의 판정과 비교 결과를 고르세요.';return render()}
    go(4);
  },
  pcr(k){
    if(+k===S.pcrDone.length){S.pcrDone.push(+k);S.msg=''}
    else{S.pcrWrong++;S.pcrNope=+k;S.msg=`${S.pcrDone.length+1}번째 단계가 아니에요. 앞 단계에서 무엇을 했는지 생각해 보세요.`}
    render();
  },
  pcrJ(a){const[p,v]=parts(a);S.pcrJudge[p]=v;render()},
  toCompare(){
    if(!S.pcrJudge.p3||!S.pcrJudge.p4){S.msg='검사 순서를 맞추고 30회 증폭한 뒤 사람 3과 4를 판정하세요.';return render()}
    go(5);
  },
  qgo(k){S.q=+k;render()},
  qmove(d){S.q=Math.max(0,Math.min(QUESTIONS.length-1,S.q+ +d));render()},
  finishAll(){S.finished=new Date().toLocaleString('ko-KR');go(7)},
  print(){window.print()},
  copy(){
    const text=`학번 ${S.id} 이름 ${S.name}
`+document.getElementById('report').innerText+'\n\n'+document.getElementById('teacher').textContent;
    const say=m=>document.getElementById('copied').textContent=m;
    navigator.clipboard.writeText(text).then(()=>say('복사했어요.'),()=>say('복사하지 못했어요. 결과지를 직접 선택해 복사하세요.'));
  },
  restart(){
    if(!S.confirm){S.confirm=true;return render()}
    S=fresh(S.restarts+1);render();
  },
  cancel(){S.confirm=false;render()},
};

// 기다리는 동안 타이머를 갱신하고, 끝나면 다음 단계로 넘어간다
function tick(){
  if(!S.waitUntil)return;
  if(Date.now()>=S.waitUntil){S.waitUntil=0;S.block++;S.clock+=5;return render()}
  if(S.stage===1)render();
  setTimeout(tick,500);
}
function render(){
  document.getElementById('bars').innerHTML=STAGES.map((_,i)=>`<i class="${i<=S.stage?'on':''}"></i>`).join('');
  document.getElementById('stepnow').textContent=`${S.stage+1} / ${STAGES.length} ${STAGES[S.stage]}`;
  document.getElementById('steps').innerHTML=STAGES.map((s,i)=>`<li class="${i<S.stage?'past':''}" ${i===S.stage?'aria-current="step"':''}>${s}</li>`).join('');
  const r=document.getElementById('restart');
  r.textContent=S.confirm?'입력한 내용을 지우고 처음부터 시작':'처음부터';
  app.innerHTML=(S.confirm?`<div class="row noprint">${btn('cancel','','계속 진행하기')}<span class="note">처음부터 시작하면 쓴 내용이 지워지고, 다시 시작한 횟수가 결과지에 남아요.</span></div>`:'')+views[S.stage]();
  save();
}

let lastAct=null;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  lastAct=[b.dataset.act,b.dataset.arg];S.nope=null;S.pcrNope=null;
  A[b.dataset.act](b.dataset.arg);
  // 화면을 다시 그려도 키보드 위치를 잃지 않게 한다
  const again=[...document.querySelectorAll('[data-act]')].find(x=>x.dataset.act===lastAct[0]&&x.dataset.arg===lastAct[1]);
  if(again&&document.activeElement===document.body)again.focus({preventScroll:true});
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind){
    const path=t.dataset.bind.split('.'),k=path.pop();
    path.reduce((o,p)=>o[p],S)[k]=t.value;save();
  }
  if(t.dataset.range==='cycles'){
    const c=caseFor(S.id);S.cycles=+t.value;
    document.getElementById('cyc').textContent=S.cycles+'회';
    document.getElementById('cyccopy').textContent=(2**S.cycles).toLocaleString('ko-KR')+'개';
    document.getElementById('chart3').innerHTML=pcrChart(c.p3,S.cycles,'사람 3');
    document.getElementById('chart4').innerHTML=pcrChart(!c.p3,S.cycles,'사람 4');
    document.getElementById('pcrj').innerHTML=pcrJudge();save();
  }
  if(t.dataset.range==='day'){
    S.day=+t.value;
    document.getElementById('dayv').textContent=S.day+'일';
    document.getElementById('chartd').innerHTML=dayChart(S.day);
    document.getElementById('dayres').innerHTML=dayResult();save();
  }
});
render();tick();
</script>
